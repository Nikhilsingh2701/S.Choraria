<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Placeholder</title>
</head>
<body>
    <!-- 
        This form is a dummy version for Netlify's build bot.
        It will not be visible to users.
        Ensure ALL form 'name' attributes match your React form.
    -->
    <form
        name="job-application"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
        enctype="multipart/form-data"
    >
        <!-- The hidden input for form-name is critical -->
        <input type="hidden" name="form-name" value="job-application" />
        <!-- The honeypot field -->
        <input type="hidden" name="bot-field" />

        <!-- All your fields with their 'name' attributes -->
        <input type="text" name="applicant_name" />
        <input type="email" name="email" />
        <input type="tel" name="mobile" />
        <input type="text" name="position" />
        <input type="file" name="resume" />
    </form>
</body>
</html>
